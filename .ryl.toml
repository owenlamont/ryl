indent-width = 2
# Test inputs must stay byte-exact; never lint or format them.
exclude = ["tests/"]

[files]
yaml = [
    "*.yaml",
    "*.yml",
    ".yamllint",
]
markdown = ["*.md", "*.markdown", "*.mdx", "*.qmd", "*.Rmd"]

# docs/rules/*.md deliberately embed invalid YAML in fenced blocks to demonstrate
# each rule, so scan front matter only.
[markdown]
fenced-blocks = false

[lint.rules]
anchors = "enable"
block-scalar-chomping = "enable"
comments = "disable"
comments-indentation = "disable"
document-end = "disable"
document-start = "disable"
empty-values = "disable"
float-values = "disable"
key-duplicates = "enable"
key-ordering = "disable"
line-length = "disable"
merge-keys = "enable"
new-line-at-end-of-file = "enable"
new-lines = "enable"
octal-values = "disable"
quoted-strings = "disable"
tags = "enable"
trailing-spaces = "enable"
truthy = "disable"
unicode-line-breaks = "enable"

[lint.rules.braces]
level = "warning"
max-spaces-inside = 1

[lint.rules.brackets]
level = "warning"
max-spaces-inside = 1

[lint.rules.colons]
level = "warning"

[lint.rules.commas]
level = "warning"

[lint.rules.empty-lines]
level = "warning"

[lint.rules.hyphens]
level = "warning"

[lint.rules.indentation]
indent-sequences = "consistent"
level = "warning"

[format]
quote-style = "single"
line-ending = "lf"
indent-sequences = true
dash-on-own-line = false
brace-spacing = true
max-blank-lines = 1
comment-spacing = 2
comment-starting-space = "add"
document-start = "preserve"
document-end = "preserve"
fold-long-lines = false
sequence-style = "preserve"
mapping-style = "preserve"

[package]
name = "granit-parser"
readme = "README.md"
authors = [
  # Provided versions up to saphyr-parser 0.0.6 inclusive
  "Ethiraric <ethiraric@gmail.com>",
  "David Aguilar <davvid@gmail.com>",
  "Yuheng Chen <yuhengchen@sensetime.com>",

  # Later versions (serde-granit)
  "Bourumir Wyngs <bourumir-wyngs@gmail.com>"
]
categories = [ "encoding", "parser-implementations", "text-processing" ]
description = "A YAML parser with comment, tag and style support, written in pure Rust"
documentation = "https://docs.rs/granit-parser/latest/granit_parser"
edition = "2021"
keywords = [ "yaml", "parser", "no-std", "cst" ]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bourumir-wyngs/granit-parser"

rust-version = "1.81.0"
version = "2.0.0"
exclude = [
  # Exclude the `yaml-test-suite` from the package. This removes the need to
  # add its license to the package.
  "/tests/yaml-test-suite",
  # These repository-only checks import the separate fuzz package, which Cargo omits.
  "/tests/fuzz_targets.rs",
  # We don't need the documents either.
  "/documents",
]

[features]
default = ["error_messages", "std", "comments"]
# Capture and emit comments; without this feature, YAML comments are validated and then ignored
comments = []
error_messages = []
std = []
debug_prints = ["std"]

[dependencies]
arraydeque = { version = "0.5.1", default-features = false }
smallvec = {  version = ">=1.6.1, < 2.0.0" }

[dev-dependencies]
libtest-mimic = "0.8.2"

[[test]]
name = "yaml-test-suite"
harness = false

[[test]]
name = "comment"
required-features = ["comments"]

[[test]]
name = "comments_possible"
required-features = ["comments"]

[[bin]]
name = "dump_events"
path = "tools/dump_events.rs"

[[bin]]
name = "time_parser"
path = "tools/time_parse.rs"

[[bin]]
name = "run_parser"
path = "tools/run_bench.rs"

[[example]]
name = "fallible_reader"
required-features = ["std"]

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

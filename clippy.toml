# lsp-types pins bitflags 1.x and fluent-uri 0.1, jsonschema's fraction pins num-bigint
# 0.4, and synstructure pins syn 2 while other dependencies use newer versions.
allowed-duplicate-crates = [
    "bitflags",
    # postcard's optional embedded-io 0.4 and 0.6 dependencies are never enabled.
    "embedded-io",
    "fluent-uri",
    "num-bigint",
    "syn",
    # postcard's cobs is on thiserror 2.x and dirs-next reaches 1.x only on Redox.
    "thiserror",
    "thiserror-impl",
    # ring pins windows-sys 0.52 while the other Windows dependencies use 0.61.
    "windows-sys",
]
excessive-nesting-threshold = 5

# Docker Compose files
[files]
yaml = [
    "*.yaml",
    "*.yml",
    ".yamllint",
]

[lint.rules]
# Upstream examples omit initial markers: https://github.com/docker/awesome-compose/blob/master/wordpress-mysql/compose.yaml
document-start = "disable"
anchors = "enable"
braces = "enable"
brackets = "enable"
colons = "enable"
commas = "enable"
document-end = "disable"
empty-lines = "enable"
empty-values = "disable"
float-values = "disable"
hyphens = "enable"
indentation = "enable"
key-duplicates = "enable"
key-ordering = "disable"
line-length = "enable"
new-line-at-end-of-file = "enable"
new-lines = "enable"
octal-values = "disable"
trailing-spaces = "enable"

[lint.rules.comments]
level = "warning"

[lint.rules.comments-indentation]
level = "warning"

[lint.rules.truthy]
level = "warning"

[lint.rules.tags]
# Compose merge tags: https://docs.docker.com/reference/compose-file/merge/
allowed-tags = ["!reset", "!override"]

[lint.rules.quoted-strings]
required = false
extra-required-flow = ['\?|^:']

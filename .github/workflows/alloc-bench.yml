name: Allocator benchmark
on:
  pull_request:
permissions:
  contents: read
jobs:
  bench:
    if: github.head_ref == 'perf/global-allocator-886'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            variants: system,jemalloc,mimalloc
          - os: ubuntu-24.04-arm
            variants: system,jemalloc,mimalloc
          - os: macos-latest
            variants: system,jemalloc,mimalloc
          - os: windows-latest
            variants: system,mimalloc
    runs-on: ${{ matrix.os }}
    env:
      VARIANTS: ${{ matrix.variants }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

      - name: Install hyperfine
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
        with:
          tool: hyperfine

      - name: Fetch inputs
        run: uv run --no-project bench/alloc/fetch.py "$RUNNER_TEMP/alloc"

      - name: Build variants
        run: |-
          mkdir -p "$RUNNER_TEMP/alloc/bin"
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          for v in ${VARIANTS//,/ }; do
            features=()
            if [ "$v" != system ]; then features=(--features "alloc-$v"); fi
            cargo build --release --locked "${features[@]}"
            cp "target/release/ryl$ext" "$RUNNER_TEMP/alloc/bin/ryl-$v$ext"
          done

      - name: Benchmark
        run: >-
          uv run --no-project bench/alloc/run.py "$RUNNER_TEMP/alloc" "$VARIANTS"
          "$RUNNER_TEMP/results"

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: alloc-bench-${{ matrix.os }}
          path: ${{ runner.temp }}/results

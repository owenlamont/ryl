name: CI
on:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    # Read-only: this job runs the broadly-executed prek hooks (including unpinned `npx`
    # invocations and lychee/zizmor's tokened online checks), so it must not hold a
    # write-scoped token. The PR coverage comment lives in the separate `coverage-comment`
    # job below, which is the only place that needs `pull-requests: write`.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

      - name: Install Python 3.15 for inline scripts
        run: uv python install 3.15

      - name: Install prek
        run: uv tool install prek --force

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Install Rust components
        run: rustup component add rustfmt clippy llvm-tools-preview

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
        with:
          tool: cargo-nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-audit
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
        with:
          tool: cargo-audit

      # Needed by the prek `comment-ratio` hook (source_size.py gate). tokei has no
      # prebuilt release binary and is not in taiki-e/install-action, so install the
      # same conda-forge build run locally via pixi; bump the pin alongside AGENTS.md.
      - name: Install tokei
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          run-install: false
          global-environments: tokei=14.0.0
      - name: Put pixi global tools on PATH
        run: echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Run prek hooks (lint and static checks)
        env:
          SKIP: no-commit-to-branch
          # lychee's external link checks (and zizmor's online supply-chain audits)
          # call the GitHub API; the token avoids anonymous rate limits.
          GITHUB_TOKEN: ${{ github.token }}
        run: prek run --all-files

      - name: Check the minimal build (LSP feature compiled out)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Validate the agent skill (skills/ryl)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

      # The formatter property suites check values against the YAML reference parser.
      - name: Install Node for the YAML reference parser
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Fetch the YAML test suite and reference parser
        run: git submodule update --init crates/ryl-yaml-parser/tests/yaml-test-suite tests/yaml-reference-parser

      - name: Replay saved property seeds
        env:
          PROPTEST_CASES: '0'
        run: cargo nextest run --workspace -E 'test(/^property_/)'

      - name: Run doctests
        run: cargo test --workspace --doc

      - name: Test the coverage gate helper
        run: uv run --no-project --python 3.15 --with pytest pytest -q .agents/skills/coverage/test_coverage_missing.py

      - name: Run tests with coverage (nextest + cargo-llvm-cov)
        env:
          PROPTEST_CASES: '0'
          PROPTEST_DISABLE_FAILURE_PERSISTENCE: '1'
        run: |-
          set -euo pipefail
          # Run the suite once; every report below is derived from this single run's
          # cached profile data via `cargo llvm-cov report` (no re-execution).
          # A cache restored for an older Cargo.lock still holds this crate's
          # instrumented binaries, which the report would otherwise count.
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --workspace --no-report
          echo '### Test Coverage (nextest + cargo-llvm-cov)' > coverage.md
          echo '```text' >> coverage.md
          cargo llvm-cov report --workspace --summary-only | tee -a coverage.md
          echo '```' >> coverage.md
          # Produce LCOV for detailed per-line/branch analysis
          cargo llvm-cov report --workspace --lcov --output-path lcov.info
          echo '' >> coverage.md
          echo '#### Missed Lines (per file)' >> coverage.md
          awk -F: '
            /^SF:/ {f=$2}
            /^DA:/ {split($2,a,","); if (a[2]==0) lines[f]=lines[f] a[1] ","}
            END {
              for (f in lines) {
                gsub(/,$/, "", lines[f]);
                printf("- %s: %s\n", f, lines[f]);
              }
            }
          ' lcov.info | sort >> coverage.md || true
          echo '' >> coverage.md
          if grep -q '^BRDA:' lcov.info; then
            echo '#### Missed Branches (per file)' >> coverage.md
            awk -F: '
              /^SF:/ {f=$2}
              /^BRDA:/ {
                split($2,a,",");
                # a[4] is taken count; treat 0 or - as missed
                if (a[4]=="-" || a[4]==0) {
                  branches[f]=branches[f] sprintf("%s(b%s)", a[1], a[3]) ",";
                }
              }
              END {
                for (f in branches) {
                  gsub(/,$/, "", branches[f]);
                  printf("- %s: %s\n", f, branches[f]);
                }
              }
            ' lcov.info | sort >> coverage.md || true
          fi

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage
          path: |-
            coverage.md
            lcov.info

      - name: Enforce coverage thresholds
        run: |-
          # Enforce zero missed lines and regions, reusing the single test run's data.
          # Kept as the final step so the coverage artifact is uploaded (and the
          # coverage-comment job can post it) before a coverage gap fails the job.
          set -euo pipefail
          cargo llvm-cov report --workspace --summary-only \
            --ignore-filename-regex 'crates/ryl-yaml-parser/' \
            --fail-uncovered-lines 0 \
            --fail-uncovered-regions 0
          # ryl-yaml-parser is generic over Input, so no one instantiation reaches every region; gate it on union coverage.
          cargo llvm-cov report --workspace --json --output-path coverage.json
          uv run .agents/skills/coverage/coverage-missing.py --report-json coverage.json

  platform-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-tests
            os: windows-latest
            cargo-args: ''
          - name: linux-cli-tests
            os: ubuntu-latest
            cargo-args: --no-default-features
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

      - name: Install Python 3.15 for inline scripts
        run: uv python install 3.15

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
        with:
          tool: cargo-nextest

      # The formatter property suites check values against the YAML reference parser.
      - name: Install Node for the YAML reference parser
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Fetch the YAML test suite and reference parser
        run: git submodule update --init crates/ryl-yaml-parser/tests/yaml-test-suite tests/yaml-reference-parser

      - name: Run tests
        env:
          PROPTEST_CASES: '0'
        run: cargo nextest run --workspace ${{ matrix.cargo-args }}

  coverage-comment:
    # Posting the coverage comment needs `pull-requests: write`, so it is isolated here,
    # keeping the `checks` job (and every prek hook it runs) read-only. Runs even when
    # `checks` fails (e.g. a coverage-threshold gap) so the report is still posted; the
    # artifact only exists when the run got far enough to produce coverage, so the comment
    # step is guarded on that.
    needs: checks
    if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: coverage
        continue-on-error: true

      - name: Comment coverage summary on PR
        if: hashFiles('coverage.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: ryl-coverage
          path: coverage.md

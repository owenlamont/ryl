[workspace]
members = ["crates/ryl-yaml-parser"]

[package]
name = "ryl"
autotests = false
version = "0.27.0"
edition = "2024"
rust-version = "1.99.1"
description = "Fast YAML linter and formatter"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/owenlamont/ryl"
categories = ["command-line-utilities", "development-tools"]
keywords = ["yaml", "lint", "formatter", "cli", "rust"]
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/LICENSE",
  "/LICENSE-APACHE",
  "/README.md",
  "/clippy.toml",
  # Required in the maturin-built sdist so pip can discover the PEP 517 build
  # backend when installing from source.
  "/pyproject.toml",
  "/rust-toolchain.toml",
  "/rustfmt.toml",
  "/ryl.toml.schema.json",
  "/ryl.yaml.schema.json",
  "/src/**",
  "/tests/**",
]

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[[bin]]
name = "ryl"
path = "src/main.rs"
test = false

[lib]
test = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[features]
default = ["lsp"]
# The `ryl server` language server; build `--no-default-features` for a minimal
# linter-only binary. crossbeam-channel is a direct dep because lsp-server exposes
# its Sender/Receiver on the Connection.
lsp = ["dep:lsp-server", "dep:lsp-types", "dep:crossbeam-channel"]

[dependencies]
clap = { version = "4.6.0", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
clap_complete = "4.6"
globset = "0.4.18"
ignore = "0.4.25"
rayon = "1.11.0"
schemars = { version = "1.2.1", features = ["derive"] }
ryl-yaml-parser = { version = "0.1.1", path = "crates/ryl-yaml-parser" }
hashlink = "0.12.0"
ordered-float = "5"
dirs-next = "2.0.0"
regex = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
similar = { version = "3.1.1", default-features = false, features = ["text"] }
unicode-normalization = "0.1"
encoding_rs = "0.8"
toml = "1.1.2"
toml_edit = "0.25.17"
pulldown-cmark = { version = "0.13.4", default-features = false }
quick-xml = { version = "0.42", default-features = false }
sha2 = "0.11"
same-file = "1.0.6"
lsp-server = { version = "0.10.0", optional = true }
lsp-types = { version = "0.97.0", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
num-bigint = { version = "0.5", default-features = false, features = ["std"] }
blake3 = "1.8"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
mimalloc = "0.1.52"

[dev-dependencies]
noyalib = "0.0.58"
# A different diff implementation than `similar` (which produces the diff), so the
# `--diff` round-trip property test validates the output is standard-compliant.
diffy = { version = "0.5.0", default-features = false }
jsonschema = "0.60.0"
proptest = "1.11.0"
tempfile = "3"
# Non-optional for the `lsp`-feature integration tests; keep versions matching the
# optional runtime deps above.
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde_json = "1.0.149"

# Pinned real-world repos for scripts/formatter_corpus_check.py. `sparse` replaces the
# default `*.yaml`/`*.yml` checkout patterns (gitignore syntax), `expected-skip` globs name
# files ryl should skip as invalid YAML, `tally = false` skips the slow diagnostic count
# on huge files, and `modes` limits the runs. A `*-known-errors` entry waives that
# oracle's value verdict on one file only while its bytes match both pinned hashes.


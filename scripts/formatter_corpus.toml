# Pinned real-world repos for scripts/formatter_corpus_check.py. `sparse` replaces the
# default `*.yaml`/`*.yml` checkout patterns (gitignore syntax), `expected-skip` globs name
# files ryl should skip as invalid YAML, and `tally = false` skips the slow diagnostic
# count on huge files.


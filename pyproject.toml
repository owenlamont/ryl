[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "ryl"
version = "0.28.0"
description = "Fast YAML linter and formatter"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = [
    "LICENSE",
    "LICENSE-APACHE",
    "crates/ryl-yaml-parser/LICENSE",
    "crates/ryl-yaml-parser/.licenses/*",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: File Formats",
    "Topic :: Text Processing :: Markup",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
keywords = ["yaml", "linter", "lint", "formatter", "cli", "rust"]

[project.urls]
Homepage = "https://github.com/owenlamont/ryl"
Repository = "https://github.com/owenlamont/ryl"
Issues = "https://github.com/owenlamont/ryl/issues"

[dependency-groups]
docs = ["zensical>=0.0.42"]

[tool.maturin]
bindings = "bin"
sdist = true
